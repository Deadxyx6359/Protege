# Protege -- local, offline AI assistant with a knowledge lock system.
#
# Deliberately not published anywhere. There is no build backend configured and
# no upload target; this file exists to configure pytest and to declare the
# supported Python version in one place.

[project]
name = "protege"
version = "0.1.0"
description = "Local offline AI assistant gated by a knowledge lock system"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import the package from the repo root without an install step. Protege is run
# from a checkout, not from site-packages.
pythonpath = ["."]
# --capture=sys, not the default fd-level capture. Redirecting real file
# descriptors breaks Tcl/Tk initialisation partway through a run: a later
# `tk.Tk()` fails with "Can't find a usable init.tcl" or "tk wasn't installed
# properly", about files that plainly exist. tests/conftest.py documents the
# mechanism. It became unavoidable once Qt tests shared the process with the
# Tkinter ones — without this the suite loses ~19 tests to spurious errors and
# takes minutes instead of seconds.
addopts = "-q --strict-markers --capture=sys"
filterwarnings = ["error::DeprecationWarning:protege.*"]
